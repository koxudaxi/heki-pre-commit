# heki installed from its wheels on PyPI (the version this repository pins in pyproject.toml), so
# no Rust toolchain or build is needed. heki follows calls across files, so the hook checks the
# whole project rather than the files a commit changes.
- id: heki
  name: heki
  description: Check side effects and mutations across function calls
  entry: heki check
  language: python
  types: [python]
  pass_filenames: false
  require_serial: true
  # Warnings do not fail `heki check`, and pre-commit hides the output of a hook that passes.
  verbose: true
